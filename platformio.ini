[env:gd32e230c8t6]
platform = https://github.com/CommunityGD32Cores/platform-gd32.git
board = genericGD32E230C8
framework = spl
monitor_speed = 115200
upload_protocol = gdlinkcli
board_build.ldscript = ldscripts/GD32E230C8_CONFIG.ld
build_flags =
    -I include

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags =
    -DPIO_UNIT_TESTING
    -I include
    -I lib/pid
    -I lib/flash_store
    -I lib/max6675
    -I lib/reflow_profile
    -I lib/thermal_control
    -I lib/ec11
